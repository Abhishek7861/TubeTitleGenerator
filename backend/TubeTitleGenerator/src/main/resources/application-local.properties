# Loaded when spring.profiles.active=local — overrides base application.properties.
# OAuth is disabled by LocalSecurityConfig, so Google client credentials are not needed.

# Prevent auto-configuration from failing on missing OAuth2 client props
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.reactive.ReactiveOAuth2ClientAutoConfiguration

# Local cookie config (no cross-site issues in dev)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
