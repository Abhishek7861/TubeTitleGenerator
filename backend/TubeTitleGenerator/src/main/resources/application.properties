spring.application.name=TubeTitleGenerator

server.port=${PORT:8080}

# OpenAI
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-5.6-luna
openai.image-model=gpt-image-1
openai.image-size=1536x1024

# Gemini
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.7-flash

# Default provider
ai.provider=GEMINI

#Google_Auth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Frontend URL (used for OAuth redirect + CORS)
app.frontend-url=${FRONTEND_URL:http://localhost:5174}

server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
